name: Builder

on:
  push:
    branches:
      - master
      - dev-pcie8
  pull_request:
    branches:
      - master
      - dev-pcie8

jobs:
  build-debug:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: chraac/pico-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Configure And Build
        run: mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Debug && make -j$(nproc)
  build-release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: chraac/pico-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Configure And Build
        run: mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release && make -j$(nproc)
  unit-tests:
    # host-side logic tests (test/): same sources as the firmware, compiled
    # against a fake pico-sdk -- see docs/testing.md
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: chraac/pico-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure And Build Unit Tests
        run: cmake -S test -B build-test -DCMAKE_BUILD_TYPE=Release && cmake --build build-test -j$(nproc)
      - name: Run Unit Tests
        run: ctest --test-dir build-test --output-on-failure
  build-emulator-fw:
    # INTEGRATION_TEST pcie build (UART stdio + TEST: log lines) for the
    # rp2040js integration tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: chraac/pico-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure And Build Emulator Firmware
        run: mkdir -p build-emu && cd build-emu && cmake .. -DPICO_BOARD=seeed_xiao_rp2040 -DINTEGRATION_TEST=ON -DUSB_STDIO=false -DCMAKE_BUILD_TYPE=Release && make -j$(nproc) pwm_controller_pcie_emu
      - name: Upload Emulator Firmware
        uses: actions/upload-artifact@v4
        with:
          name: emulator-fw
          path: build-emu/exec/pwm_controller_pcie_emu.elf
  integration-tests:
    # boots the emulator firmware in the vendored rp2040js simulator
    # (test/integration) and asserts the control-loop behavior
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build-emulator-fw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Emulator Firmware
        uses: actions/download-artifact@v4
        with:
          name: emulator-fw
          path: emu-fw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Integration Scenarios
        run: bash test/integration/run.sh emu-fw/pwm_controller_pcie_emu.elf --ci
      - name: Run unit tests
        run: |
          mkdir -p build/unit 
          cd build/unit 
          cmake ../../test -DCMAKE_BUILD_TYPE=Release 
          make -j$(nproc)
          ctest --output-on-failure
